name: Create 1.5GB Artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create 1.5GB file
        run: |
          dd if=/dev/urandom of=sample_1_5gb.bin bs=1M count=1500

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-1-5gb-file
          path: sample_1_5gb.bin
